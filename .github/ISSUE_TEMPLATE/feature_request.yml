name: Feature request
description: Propose a focused improvement to QuotaDock.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and alternatives
      description: Include scope, platform, privacy implications, and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How would we verify success?
      description: Concrete behavior, including unknown data and OS refresh limitations.
