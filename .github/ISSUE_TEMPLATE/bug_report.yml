name: Bug report
description: Report reproducible source-preview behavior using safe demo data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste credentials, tokens, account IDs, raw CodexBar output, or pairing screenshots. Security problems belong in SECURITY.md's private reporting process."
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit, OS, Node/Xcode version, and affected surface.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer demo data. Include steps and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification and sanitized evidence
      description: Test results, freshness, and safe screenshots only.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I searched existing issues and removed all credentials and account identifiers.
          required: true
